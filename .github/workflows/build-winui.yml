name: Build WinUI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\PharaohGameTools.WinUI.sln

      - name: Build Release
        run: dotnet build .\PharaohGameTools.WinUI.sln -c Release --no-restore

      - name: Publish x64 framework-dependent single-file
        run: |
          dotnet publish .\PharaohGameTools.WinUI\PharaohGameTools.WinUI.csproj `
            -c Release `
            -p:PublishProfile=win-x64-fdd `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Bundle launcher and Windows App Runtime prerequisites
        shell: pwsh
        run: |
          $publishDir = ".\PharaohGameTools.WinUI\bin\Release\net9.0-windows10.0.26100.0\win-x64\publish-fdd"
          $runtimeSource = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.runtime\*\tools\MSIX\win10-x64" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $runtimeSource) {
            throw "Windows App Runtime MSIX bundle not found in NuGet cache."
          }
          $runtimeTarget = Join-Path $publishDir "Prereqs\WindowsAppRuntime\win-x64"
          New-Item -ItemType Directory -Path $runtimeTarget -Force | Out-Null
          Copy-Item ".\Launch-PharaohGameTools.WinUI.ps1" $publishDir -Force
          Copy-Item ".\Launch-PharaohGameTools.WinUI.cmd" $publishDir -Force
          Copy-Item (Join-Path $runtimeSource.FullName "*.msix") $runtimeTarget -Force

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharaohGameTools.WinUI-win-x64-fdd
          path: .\PharaohGameTools.WinUI\bin\Release\net9.0-windows10.0.26100.0\win-x64\publish-fdd\

      - name: Create release package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $publishDir = ".\PharaohGameTools.WinUI\bin\Release\net9.0-windows10.0.26100.0\win-x64\publish-fdd"
          $releaseDir = ".\release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Compress-Archive -Path "$publishDir\*" -DestinationPath "$releaseDir\PharaohGameTools.WinUI-win-x64-fdd-${{ github.ref_name }}.zip" -Force

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .\PharaohGameTools.WinUI\bin\Release\net9.0-windows10.0.26100.0\win-x64\publish-fdd\PharaohGameTools.WinUI.exe
            .\PharaohGameTools.WinUI\bin\Release\net9.0-windows10.0.26100.0\win-x64\publish-fdd\Launch-PharaohGameTools.WinUI.cmd
            .\PharaohGameTools.WinUI\bin\Release\net9.0-windows10.0.26100.0\win-x64\publish-fdd\Launch-PharaohGameTools.WinUI.ps1
            .\release\PharaohGameTools.WinUI-win-x64-fdd-${{ github.ref_name }}.zip
          generate_release_notes: true
